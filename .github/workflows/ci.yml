name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  REDIS_CONNECTION: 127.0.0.1:6379

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore DotNop.Channels.Redis.slnx

      - name: Build
        run: dotnet build DotNop.Channels.Redis.slnx -c Release --no-restore

      - name: Test
        # One test module (TFM) at a time: they share one Redis and the runner's few cores.
        run: dotnet test --solution DotNop.Channels.Redis.slnx -c Release --no-build --max-parallel-test-modules 1

      - name: Pack
        run: dotnet pack src/DotNop.Channels.Redis/DotNop.Channels.Redis.csproj -c Release --no-build -o artifacts/packages

      - uses: actions/upload-artifact@v5
        with:
          name: packages
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # OIDC token for NuGet Trusted Publishing

    steps:
      - uses: actions/download-artifact@v5
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: me-viper

      - name: Push
        run: >-
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
